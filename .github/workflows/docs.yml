name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Claude Code for executable Claude acceptance scenarios
        run: npm install --global @anthropic-ai/claude-code@2.1.318

      - name: Verify acceptance scenarios and their generated documentation
        run: |
          python3 -m unittest discover -s tests -p test_scenarios.py
          python3 scripts/scenarios.py --check

      - name: Verify model fixtures and generated LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base
          curl -fsSL https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar -o "$RUNNER_TEMP/tla2tools.jar"
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $RUNNER_TEMP/tla2tools.jar" | sha256sum --check
          python3 scripts/model_traces.py --jar "$RUNNER_TEMP/tla2tools.jar" --check
          python3 scripts/integration_traces.py --jar "$RUNNER_TEMP/tla2tools.jar" --check
          python3 scripts/spec_latex.py --jar "$RUNNER_TEMP/tla2tools.jar" --check
          python3 -m unittest discover -s tests -p test_contract_docs.py
          python3 -m unittest discover -s tests -p test_model_math.py

      - name: Verify command and Claude integration contracts
        run: |
          node --test tests/test_integration_contract.mjs
          claude plugin test .

      - name: Verify editor integration contracts
        run: |
          curl -sSfL https://github.com/neovim/neovim/releases/download/v0.11.4/nvim-linux-x86_64.tar.gz | tar -xz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/nvim-linux-x86_64/bin/nvim" --headless -l tests/integration_contract_spec.lua

      # Pages come from the README, spec guide, and executable scenario/contract fixtures.
      - name: Check generated site pages
        run: |
          python3 docs/sync.py

      - name: Install Zine
        run: |
          version=$(sed -n 's/.*\.zine_version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' docs/zine.ziggy)
          curl -sSfL "https://github.com/kristoff-it/zine/releases/download/v$version/x86_64-linux-musl.tar.xz" | tar -xJ -C /usr/local/bin zine

      - name: Install the pinned math renderer
        run: npm install --no-save --prefix "$RUNNER_TEMP/model-math" katex@0.16.22 jsdom@26.1.0

      - name: Build the site
        working-directory: docs
        run: |
          zine release
          MODEL_DOM_MODULE="$RUNNER_TEMP/model-math/node_modules/jsdom" node ../scripts/check_behavior_filters.mjs
          MODEL_DOM_MODULE="$RUNNER_TEMP/model-math/node_modules/jsdom" node ../scripts/check_live_model_math.mjs
          KATEX_MODULE="$RUNNER_TEMP/model-math/node_modules/katex" node ../scripts/render_model_math.mjs
          python3 ../scripts/check_model_html.py

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs/public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
